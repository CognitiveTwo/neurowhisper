name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt scikit-learn

      - name: Byte-compile
        shell: bash
        run: python -m py_compile whisper_gui.pyw app_config.py platform_utils.py backends/*.py analysis/*.py tests/*.py

      - name: Smoke test
        run: python tests/smoke_test.py

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v

  linux:
    name: Linux test suite / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libportaudio2 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt scikit-learn

      - name: Syntax & byte-compile checks
        run: |
          bash -n run.sh
          python -m py_compile whisper_gui.pyw app_config.py platform_utils.py backends/*.py analysis/*.py tests/*.py

      - name: Smoke test
        run: xvfb-run -a python tests/smoke_test.py

      - name: Unit and integration tests
        run: xvfb-run -a python -m unittest discover -s tests -v
