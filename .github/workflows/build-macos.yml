name: Build macOS Standalone (.dmg)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "macos/**"
      - ".github/workflows/build-macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-dmg:
    name: macOS DMG (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            label: Apple Silicon arm64
          - runner: macos-15-intel
            arch: x86_64
            label: Intel x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install PortAudio (build-time fallback if wheel omits dylib)
        run: |
          if ! brew list portaudio >/dev/null 2>&1; then
            brew install portaudio
          fi

      - name: Validate shell scripts & Apple plists
        run: |
          bash -n macos/packaging/build_dmg.sh macos/packaging/Unquarantine.command
          plutil -lint macos/resources/Info.plist macos/resources/entitlements.plist

      - name: Run macOS unit & smoke test suite
        env:
          NEUROWHISPER_NO_DIALOGS: "1"
          NEUROWHISPER_NO_TRAY: "1"
        run: |
          uv venv /tmp/nw-macos-test-venv --python 3.12
          uv pip install --python /tmp/nw-macos-test-venv/bin/python -r macos/requirements-macos.txt
          PYTHONPATH=macos/src /tmp/nw-macos-test-venv/bin/python -m py_compile \
            macos/src/neurowhisper_mac/*.py \
            macos/src/neurowhisper_mac/backends/*.py \
            macos/tests/*.py
          PYTHONPATH=macos/src /tmp/nw-macos-test-venv/bin/python -m unittest discover -s macos/tests -v
          PYTHONPATH=macos/src /tmp/nw-macos-test-venv/bin/python macos/tests/smoke_test.py
          rm -rf /tmp/nw-macos-test-venv

      - name: Build ad-hoc signed .app and .dmg
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          PYTHON_VERSION: "3.12"
        run: |
          ./macos/packaging/build_dmg.sh

      - name: Verify .app signature, CLI entrypoint & .dmg bundle
        run: |
          test -d macos/dist/neurowhisper.app
          codesign --verify --deep --strict --verbose=2 macos/dist/neurowhisper.app
          macos/dist/neurowhisper.app/Contents/MacOS/neurowhisper --version
          macos/dist/neurowhisper.app/Contents/MacOS/neurowhisper --help
          DMG_PATH="macos/dist/neurowhisper-macos-${{ matrix.arch }}.dmg"
          test -f "$DMG_PATH"
          ls -lh "$DMG_PATH"

      - name: Upload .dmg workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurowhisper-macos-${{ matrix.arch }}
          path: macos/dist/neurowhisper-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Attach .dmg to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: macos/dist/neurowhisper-macos-${{ matrix.arch }}.dmg
