name: Build Linux Standalone (.AppImage)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "linux/**"
      - ".github/workflows/build-linux.yml"
  pull_request:
    paths:
      - "linux/**"
      - ".github/workflows/build-linux.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-appimage:
    name: Linux AppImage (x86_64 / glibc 2.35+)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libportaudio2 \
            xvfb \
            xclip \
            wl-clipboard \
            file \
            desktop-file-utils \
            libxcb-cursor0 \
            libgl1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate shell scripts & Freedesktop metadata
        run: |
          bash -n linux/packaging/build_appimage.sh linux/resources/AppRun
          desktop-file-validate linux/resources/neurowhisper.desktop

      - name: Run Linux unit & Xvfb GUI smoke tests
        env:
          NEUROWHISPER_NO_DIALOGS: "1"
          NEUROWHISPER_NO_TRAY: "1"
        run: |
          uv venv /tmp/nw-linux-test-venv --python 3.12
          uv pip install --python /tmp/nw-linux-test-venv/bin/python -r linux/requirements-linux.txt
          PYTHONPATH=linux/src /tmp/nw-linux-test-venv/bin/python -m py_compile \
            linux/src/neurowhisper_linux/*.py \
            linux/src/neurowhisper_linux/backends/*.py \
            linux/tests/*.py
          PYTHONPATH=linux/src xvfb-run -a /tmp/nw-linux-test-venv/bin/python -m unittest discover -s linux/tests -v
          PYTHONPATH=linux/src xvfb-run -a /tmp/nw-linux-test-venv/bin/python linux/tests/smoke_test.py
          rm -rf /tmp/nw-linux-test-venv

      - name: Build standalone .AppImage
        env:
          TARGET_ARCH: x86_64
          PYTHON_VERSION: "3.12"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./linux/packaging/build_appimage.sh

      - name: Smoke-test built .AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NEUROWHISPER_NO_DIALOGS: "1"
          NEUROWHISPER_NO_TRAY: "1"
        run: |
          APPIMG="linux/dist/neurowhisper-linux-x86_64.AppImage"
          test -x "$APPIMG"
          ls -lh "$APPIMG"
          "$APPIMG" --version
          "$APPIMG" --help
          printf '{"cmd": "shutdown"}\n' | "$APPIMG" --fw-worker

      - name: Upload .AppImage workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurowhisper-linux-x86_64
          path: linux/dist/neurowhisper-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Attach .AppImage to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: linux/dist/neurowhisper-linux-x86_64.AppImage
